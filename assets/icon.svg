<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI Time Estimator icon: a probability curve on a minutes axis with a red pencil mark at the middle estimate">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D3DDE6" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="#EDF1F4"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- likely range under the curve -->
  <polygon fill="#17324D" fill-opacity="0.16"
    points="150,392 150,170 170,160 190,163 210,174 250,206 290,240 330,270 370,293 370,392"/>
  <!-- the measured curve -->
  <polyline fill="none" stroke="#17324D" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"
    points="70,392 90,380 110,320 130,230 150,170 170,160 190,163 210,174 250,206 290,240 330,270 370,293 410,310 446,322"/>
  <!-- minutes axis -->
  <line x1="62" y1="392" x2="452" y2="392" stroke="#17324D" stroke-width="14" stroke-linecap="round"/>
  <!-- the middle estimate, in red pencil -->
  <line x1="230" y1="392" x2="230" y2="96" stroke="#C8312A" stroke-width="16" stroke-linecap="round"/>
  <circle cx="230" cy="190" r="17" fill="#EDF1F4" stroke="#C8312A" stroke-width="12"/>
</svg>
